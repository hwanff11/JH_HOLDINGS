version: JDSS-3.2.2-RS6M-ONEWAY-HWM75
config_version: "3.2.2"

portfolio:
  enabled: true
  total_capital: 50000
  live_enabled: false
  # Legacy parser fields retained for backward-compatible component tests.
  # V3.2.2 allocation weights are defined by market_regime.v322_allocation below.
  core_initial_weight: 0.10
  core_target_weight: 0.15
  booster_max_weight: 0.40
  trend_months: 6
  signal_schedule: month_end
  execution_schedule: next_session
  core_underlyings:
    QQQ: QQQ
    TQQQ: QQQ
    SOXL: SOXX
  buy_approval_required: true
  risk_reducing_sells_automatic: true
  rebalance_tolerance_weight: 0.0

global:
  # H40/S3 is retained only as the virtual JDSS overlay-signal engine.
  # V3.2.2 does not execute this $20k sleeve independently.
  capital_per_symbol: 20000
  buy_fee: 0.001
  sell_fee: 0.001
  approval_required: true
  stop_loss_enabled: false
  entry_score: 55
  minimum_reversal_score: 5
  entry_max_chase_pct: 0.05
  buy_limit_buffer: 0.005
  trading_sessions:
    regular: false
    after_hours: true
    pre_market: true
  review_token_ttl_minutes: 480
  execution_token_ttl_seconds: 60
  buy_fill_timeout_seconds: 120

symbols:
  TQQQ:
    enabled: true
  SOXL:
    enabled: true

indicators:
  cci_periods: [5, 10]
  rsi_periods: [5, 14]
  ema_periods: [5, 20, 60]
  bollinger_window: 20
  bollinger_stddev: 2.0
  atr_period: 14
  volume_window: 20
  volume_baseline_excludes_current_day: true

market_regime:
  short_ema: 20
  long_ema: 60
  green_score: 25
  yellow_score: 15
  red_score: 0
  soxl_sector_guard:
    enabled: true
    benchmark_candidates: [SOXX, SMH]
    benchmark_long_ema: 60
    blocked_stages: [1, 3]
    rule: any_benchmark_below_ema60
    missing_data_policy: warn_and_allow
  v322_allocation:
    initial_capital: 50000
    hwm_reinvestment_fraction: 0.75
    sma_short: 50
    sma_long: 200
    slope_lookback: 21
    momentum_short: 21
    momentum_medium: 63
    momentum_long: 126
    volatility_window: 20
    volatility_brake: 0.30
    trend_votes_required: 3
    leverage_defensive: 0.50
    leverage_normal: 1.00
    leverage_trend: 1.25
    leverage_strong: 1.50
    rs_benchmark: SOXX
    rs_lookback: 126
    rs_sleeve_fraction: 0.50
    jdss_overlay_weight: 0.05
    monthly_reset: first_session_close
    initial_onboarding:
      enabled: true
      cumulative_fractions: [0.50, 0.75, 1.00]
      minimum_sessions_between_stages: 3

scoring:
  calibration:
    enabled: true
    method: power
    exponents:
      regime: 1.0
      oversold: 0.45
      reversal: 0.55
      volume: 0.65
      atr: 0.90
  cci5:
    bands: [[-200, 13], [-150, 10], [-100, 6]]
  cci10:
    bands: [[-200, 13], [-150, 10], [-100, 6]]
  rsi5:
    bands: [[20, 7], [25, 5], [30, 3]]
  rsi14:
    bands: [[35, 4], [40, 2]]
  bollinger:
    deep_multiplier: 0.98
    deep_score: 3
    touch_score: 2
  reversal_points_per_condition: 5
  reversal_close_position_threshold: 0.5
  volume_bands: [[1.0, 2], [1.2, 4], [1.5, 7], [2.0, 10]]
  atr_bands:
    low_1: 0.01
    low_2: 0.02
    high: 0.10
    scores: [0, 3, 5, 2]
  grades:
    S: 90
    A: 82
    B: 72
    WATCH: 50

position:
  stage_weights: [0.40, 0.30, 0.20]
  cumulative_weights: [0.40, 0.70, 0.90]

exposure:
  score_82_87: 1.00
  score_88_91: 1.00
  score_92_100: 1.00
  allow_cap_increase: true
  allow_cap_decrease_during_cycle: false

additional_entry:
  anchor: first_entry_fill_price
  max_stage_per_day: 1
  stage2:
    min_drop_from_anchor: 0.02
    min_score: 55
  stage3:
    min_drop_from_anchor: 0.05
    min_score: 55

take_profit:
  tp1_base: 0.04
  tp1_fraction: 0.30
  tp2_base: 0.10
  use_atr: false
  tp1_atr_multiplier: 0.0
  tp2_atr_multiplier: 0.0
  remainder_exit:
    enabled: false
    wait_trading_days: 20
    target_from_avg: 0.02

rebuy:
  enabled: false
  minimum_score: 82
  minimum_reversal_score: 5
  min_drop_from_avg: 0.02
  max_rebuy_per_cycle: 1
  recovery:
    cci5_gt: -100
    rsi5_gte: 35
    close_above_ema5: true
    mode: any
  reoversold:
    cci5_lte: -150
    rsi5_lte: 25
    close_below_lower_band: true
    mode: any

risk_review:
  info_days: 10
  review_days: 20
  high_days: 40

scheduler:
  signal_delay_minutes: 5
  daily_analysis_time_kst: "07:00"
  poll_interval_seconds: 30
  order_monitor_interval_seconds: 30

idle_cash:
  enabled: false
  symbol: SGOV
  cash_buffer: 0
  minimum_order_amount: 100
  buy_limit_buffer: 0.001
  sell_limit_buffer: 0.001
  orderbook_limit_offset: 0.01
  reprice_after_seconds: 60
  sweep_interval_seconds: 300
  require_sale_fill_before_entry: true

backtest:
  default_start: "2011-01-01"
  default_slippage: 0.001
  annualization_days: 252
