name: Temporary JH AUTO Finalize

on:
  push:
    branches:
      - feature/jh-auto-1.0.0-implementation-v2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/jh-auto-1.0.0-implementation-v2
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements.lock -e '.[dev]'

      - name: Apply finalization patch
        run: python tools/jh_auto_finalize_tmp.py

      - name: Format and lint
        run: |
          set -Eeuo pipefail
          ruff format src/jd_holdings/application/managed_account.py src/jd_holdings/automation/service.py src/jd_holdings/infrastructure/jh_auto_telegram.py tests/test_live_entrypoints.py tests/test_jh_auto.py tests/test_documentation_contract.py
          ruff check .

      - name: Run complete test suite
        run: pytest -q

      - name: Validate JDSS config
        run: jdss validate-config

      - name: Commit finalized feature changes
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md SECURITY.md docs src tests
          git reset .github/workflows/jh-auto-finalize.yml tools/jh_auto_finalize_tmp.py || true
          git commit -m "feat: JH AUTO 안전경계와 운영문서 완성"
          git push origin HEAD:feature/jh-auto-1.0.0-implementation-v2
