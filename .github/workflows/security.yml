name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Security scope
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.detect.outputs.run_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect documentation-only pull request
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed-files
          if grep -Ev '\.md$' /tmp/changed-files | grep -q .; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=false" >> "$GITHUB_OUTPUT"
          fi

  python-audit:
    name: Python dependency and code audit
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements.lock -e .
          python -m pip install pip-audit bandit
      - name: Audit dependencies
        run: pip-audit
      - name: Scan Python code
        run: bandit -r src -q

  codeql:
    name: CodeQL
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: python
      - name: Analyze and upload
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan repository and history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-gate:
    name: Security Gate
    needs: [scope, python-audit, codeql, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable security scans
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PYTHON_AUDIT_RESULT: ${{ needs.python-audit.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          set -Eeuo pipefail
          test "$SCOPE_RESULT" = success
          test "$GITLEAKS_RESULT" = success
          [[ "$PYTHON_AUDIT_RESULT" == success || "$PYTHON_AUDIT_RESULT" == skipped ]]
          [[ "$CODEQL_RESULT" == success || "$CODEQL_RESULT" == skipped ]]

  repository-policy:
    name: Main branch protection
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require protected main
        run: |
          set -Eeuo pipefail
          protected="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protected')"
          if [[ "$protected" != "true" ]]; then
            echo "::error::main branch protection/ruleset is not enabled"
            exit 1
          fi
