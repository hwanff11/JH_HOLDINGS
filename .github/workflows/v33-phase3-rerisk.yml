name: JDSS V3.3 Phase3 Mid-month Re-Risk Research

on:
  pull_request:
    paths:
      - 'scripts/research_v33_phase3_rerisk.py'
      - '.github/workflows/v33-phase3-rerisk.yml'
      - 'src/**'
      - 'configs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-rerisk-sweep:
    name: V3.3 Phase3 Re-Risk Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Run V3.3 phase3 re-risk sweep
        run: python scripts/research_v33_phase3_rerisk.py --output-json reports/v33-phase3-rerisk.json --output-md reports/v33-phase3-rerisk.md
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/v33-phase3-rerisk.md ]; then
            cat reports/v33-phase3-rerisk.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v33-phase3-rerisk-${{ github.run_id }}
          path: |
            reports/v33-phase3-rerisk.json
            reports/v33-phase3-rerisk.md
          if-no-files-found: error
