name: QLD V322 Simple Replacement

on:
  pull_request:
    paths:
      - "scripts/research_qld_sso_vs_v322_phase9.py"
      - ".github/workflows/qld-v322-simple-replacement.yml"
      - "scripts/research_qld_sso_vs_v322.py"
      - "scripts/research_qld_sso_alpha.py"
      - "strategy.yaml"
      - "src/**"
  workflow_dispatch:

jobs:
  simple-replacement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check scripts/research_qld_sso_vs_v322_phase9.py \
            scripts/research_qld_sso_vs_v322.py \
            scripts/research_qld_sso_alpha.py
      - name: Run Phase 9 simple replacement
        run: |
          python scripts/research_qld_sso_vs_v322_phase9.py \
            --output-json reports/qld-sso-v322-phase9.json \
            --output-md reports/qld-sso-v322-phase9.md
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: qld-v322-simple-replacement
          path: |
            reports/qld-sso-v322-phase9.json
            reports/qld-sso-v322-phase9.md
