name: Verify Oracle V3.2.2 Runtime

on:
  workflow_dispatch:
  schedule:
    # Friday 20:30 EST / 21:30 EDT: regular and after-hours sessions are closed.
    - cron: "30 1 * * 6"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-jdss-runtime-verify
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[verify-oracle-v322]'))
    runs-on: ubuntu-latest
    environment: oracle-dry-run
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source contract
        id: ref
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          runtime_ref="$(sed -nE 's/^- Oracle runtime 기능 revision: \*\*`([0-9a-f]{40})`\*\*$/\1/p' CURRENT_WORK.md | head -n1)"
          test -n "$runtime_ref"
          git cat-file -e "${runtime_ref}^{commit}"
          git merge-base --is-ancestor "$runtime_ref" HEAD
          runtime_changes="$(git diff --name-only "$runtime_ref"..HEAD -- src strategy.yaml pyproject.toml requirements.lock systemd deploy.sh)"
          if [[ -n "$runtime_changes" ]]; then
            echo "::error::Oracle runtime 이후 runtime-sensitive 변경이 main에 존재합니다"
            printf '%s\n' "$runtime_changes"
            exit 1
          fi
          echo "runtime_ref=$runtime_ref" >> "$GITHUB_OUTPUT"

          grep -q 'JDSS-3.2.2-RS6M-ONEWAY-HWM75' strategy.yaml
          grep -q 'config_version: "3.2.2"' strategy.yaml
          grep -q 'total_capital: 50000' strategy.yaml
          grep -q 'hwm_reinvestment_fraction: 0.75' strategy.yaml
          grep -q 'rs_lookback: 126' strategy.yaml
          grep -q 'rs_sleeve_fraction: 0.50' strategy.yaml
          grep -q 'jdss_overlay_weight: 0.05' strategy.yaml
          grep -q 'daily_analysis_time_kst: "07:00"' strategy.yaml
          grep -A3 '^idle_cash:' strategy.yaml | grep -q 'enabled: false'
          # The default/legacy path remains locked. Live is routed through the
          # separately commissioned runtime selector and isolated live ledger.
          grep -q 'live_enabled: false' strategy.yaml
          grep -q 'jdss-bot = "jd_holdings.runtime:main"' pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run focused V3.2.2 runtime safety tests
        run: |
          set -Eeuo pipefail
          pip install --constraint requirements.lock -e '.[dev]'
          python -m pytest \
            tests/test_v322_allocation.py \
            tests/test_v322_managed_account.py \
            tests/test_managed_account_safety.py \
            tests/test_core_approval_safety.py \
            tests/test_operational_faults.py \
            tests/test_runtime_resilience.py \
            tests/test_v322_dry_run.py \
            tests/test_live_commissioning.py \
            tests/test_live_runtime_safety.py \
            tests/test_initial_onboarding.py \
            tests/test_initial_onboarding_telegram.py

      - name: Prepare pinned SSH trust
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_SSH_KNOWN_HOSTS"
          test -n "$ORACLE_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_jdss
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle_jdss ~/.ssh/known_hosts
          # The strict SSH connection below is the authoritative parser and
          # pinned hostname/key matcher, including hashed known_hosts entries.

      - name: Detect Oracle runtime mode
        id: runtime
        env:
          SSH_KEY_PATH: /home/runner/.ssh/oracle_jdss
          SSH_KNOWN_HOSTS_PATH: /home/runner/.ssh/known_hosts
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SERVER_TARGET_DIR: /home/ubuntu/JH_HOLDINGS
        run: |
          set -Eeuo pipefail
          mode="$(ssh -i "$SSH_KEY_PATH" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH" "$SERVER_USER@$SERVER_HOST" \
            "awk -F= '\$1 == \"JDSS_TRADING_MODE\" {print \$2; exit}' '$SERVER_TARGET_DIR/shared/.env'")"
          mode="$(printf '%s' "$mode" | tr -d '\r\n')"
          case "$mode" in dry_run|live) ;; *) echo "Unexpected runtime mode" >&2; exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Verify deployed SHA and runtime contract
        env:
          SSH_KEY_PATH: /home/runner/.ssh/oracle_jdss
          SSH_KNOWN_HOSTS_PATH: /home/runner/.ssh/known_hosts
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SERVER_TARGET_DIR: /home/ubuntu/JH_HOLDINGS
          EXPECTED_SHA: ${{ steps.ref.outputs.runtime_ref }}
          EXPECTED_MODE: ${{ steps.runtime.outputs.mode }}
        run: |
          set -Eeuo pipefail
          ssh -i "$SSH_KEY_PATH" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH" "$SERVER_USER@$SERVER_HOST" \
            "TARGET_DIR='$SERVER_TARGET_DIR' EXPECTED_SHA='$EXPECTED_SHA' EXPECTED_MODE='$EXPECTED_MODE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          current="$(readlink -f "$TARGET_DIR/current")"
          env_file="$TARGET_DIR/shared/.env"
          test -d "$current"
          test -f "$env_file"
          deployed_sha="$(basename "$current")"
          if [[ -n "$EXPECTED_SHA" ]]; then
            test "$deployed_sha" = "$EXPECTED_SHA"
          fi
          test "$current" = "$TARGET_DIR/releases/$deployed_sha"
          test -x "$current/.venv/bin/jdss"
          test -x "$current/.venv/bin/jdss-bot"
          grep -q 'JDSS-3.2.2-RS6M-ONEWAY-HWM75' "$current/strategy.yaml"
          grep -q 'hwm_reinvestment_fraction: 0.75' "$current/strategy.yaml"
          grep -q 'rs_lookback: 126' "$current/strategy.yaml"
          grep -q 'daily_analysis_time_kst: "07:00"' "$current/strategy.yaml"
          grep -q 'live_enabled: false' "$current/strategy.yaml"
          sudo systemctl is-active --quiet jh_holdings_bot

          set -a
          source "$env_file"
          set +a
          test "${JDSS_TRADING_MODE:-}" = "$EXPECTED_MODE"
          if [[ "$EXPECTED_MODE" == "dry_run" ]]; then
            test -z "${JDSS_LIVE_CONFIRMATION:-}"
            db_path="$TARGET_DIR/shared/data/jdss.db"
          else
            test "${JDSS_LIVE_CONFIRMATION:-}" = "ENABLE_JDSS_LIVE_ORDERS"
            test "${JDSS_DB_PATH:-}" = "$TARGET_DIR/shared/data/jdss-live.db"
            db_path="$JDSS_DB_PATH"
            "$current/.venv/bin/python" - "$db_path" <<'PY'
          import sqlite3
          import sys
          connection = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
          try:
              values = dict(connection.execute(
                  "SELECT key, value FROM system_state "
                  "WHERE key IN ('live_commissioned','operator_buy_halt')"
              ).fetchall())
          finally:
              connection.close()
          assert values.get("live_commissioned") == "1", values
          assert values.get("operator_buy_halt") in {"0", "1"}, values
          print(f"LIVE_RUNTIME_MARKER=PASS BUY_HALT={values.get('operator_buy_halt')}")
          PY
          fi
          test -f "$db_path"
          "$current/.venv/bin/jdss" --config "$current/strategy.yaml" validate-config
          "$current/.venv/bin/jdss" --config "$current/strategy.yaml" toss-smoke
          REMOTE

      - name: Verify Telegram outbound runtime
        if: github.event_name != 'schedule'
        env:
          SSH_KEY_PATH: /home/runner/.ssh/oracle_jdss
          SSH_KNOWN_HOSTS_PATH: /home/runner/.ssh/known_hosts
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SERVER_TARGET_DIR: /home/ubuntu/JH_HOLDINGS
          RUNTIME_MODE: ${{ steps.runtime.outputs.mode }}
        run: |
          set -Eeuo pipefail
          ssh -i "$SSH_KEY_PATH" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH" "$SERVER_USER@$SERVER_HOST" \
            "TARGET_DIR='$SERVER_TARGET_DIR' RUNTIME_MODE='$RUNTIME_MODE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          current="$(readlink -f "$TARGET_DIR/current")"
          env_file="$TARGET_DIR/shared/.env"
          set -a
          source "$env_file"
          set +a
          "$current/.venv/bin/python" - "$RUNTIME_MODE" <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          mode = sys.argv[1]
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_ids = [
              item.strip()
              for item in os.environ.get("TELEGRAM_ALLOWED_CHAT_IDS", "").split(",")
              if item.strip()
          ]
          if not token or len(chat_ids) != 1:
              raise SystemExit("Telegram runtime requires one configured administrator")
          api = f"https://api.telegram.org/bot{token}"

          def call(method: str, data: dict[str, str]) -> object:
              request = urllib.request.Request(
                  f"{api}/{method}",
                  data=urllib.parse.urlencode(data).encode(),
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.load(response)
              if not payload.get("ok"):
                  raise RuntimeError(f"Telegram {method} failed")
              return payload["result"]

          identity = call("getMe", {})
          if not isinstance(identity, dict) or not identity.get("is_bot"):
              raise RuntimeError("Telegram bot identity check failed")
          message = call(
              "sendMessage",
              {
                  "chat_id": chat_ids[0],
                  "text": f"✅ JH_HOLDINGS {mode} Telegram runtime smoke",
                  "disable_notification": "true",
              },
          )
          if not isinstance(message, dict) or "message_id" not in message:
              raise RuntimeError("Telegram send confirmation missing")
          call(
              "deleteMessage",
              {
                  "chat_id": chat_ids[0],
                  "message_id": str(message["message_id"]),
              },
          )
          print("TELEGRAM_RUNTIME_SMOKE=PASS")
          PY
          REMOTE

      - name: Check whether restart verification is safe now
        if: steps.runtime.outputs.mode == 'dry_run'
        id: market
        env:
          SSH_KEY_PATH: /home/runner/.ssh/oracle_jdss
          SSH_KNOWN_HOSTS_PATH: /home/runner/.ssh/known_hosts
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SERVER_TARGET_DIR: /home/ubuntu/JH_HOLDINGS
        run: |
          set -Eeuo pipefail
          phase="$(ssh -i "$SSH_KEY_PATH" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH" "$SERVER_USER@$SERVER_HOST" \
            "TARGET_DIR='$SERVER_TARGET_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          current="$(readlink -f "$TARGET_DIR/current")"
          env_file="$TARGET_DIR/shared/.env"
          cd "$current"
          set -a
          source "$env_file"
          set +a
          "$current/.venv/bin/python" - <<'PY'
          from jd_holdings.infrastructure.market_clock import MarketClock
          print(MarketClock().classify_session())
          PY
          REMOTE
          )"
          phase="$(printf '%s' "$phase" | tail -n1 | tr -d '\r')"
          case "$phase" in
            closed|pre_market|regular|after_hours) ;;
            *) echo "Unexpected market phase: $phase" >&2; exit 1 ;;
          esac
          echo "phase=$phase" >> "$GITHUB_OUTPUT"

      - name: Restart only during closed market and verify recovery
        if: steps.runtime.outputs.mode == 'dry_run' && steps.market.outputs.phase == 'closed'
        env:
          SSH_KEY_PATH: /home/runner/.ssh/oracle_jdss
          SSH_KNOWN_HOSTS_PATH: /home/runner/.ssh/known_hosts
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SERVER_TARGET_DIR: /home/ubuntu/JH_HOLDINGS
        run: |
          set -Eeuo pipefail
          ssh -i "$SSH_KEY_PATH" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH" "$SERVER_USER@$SERVER_HOST" \
            "TARGET_DIR='$SERVER_TARGET_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          sudo systemctl restart jh_holdings_bot
          sleep 3
          sudo systemctl is-active --quiet jh_holdings_bot
          current="$(readlink -f "$TARGET_DIR/current")"
          env_file="$TARGET_DIR/shared/.env"
          cd "$current"
          set -a
          source "$env_file"
          set +a
          "$current/.venv/bin/jdss" --config "$current/strategy.yaml" validate-config
          REMOTE

      - name: Record verifier outcome
        run: |
          set -Eeuo pipefail
          mode='${{ steps.runtime.outputs.mode }}'
          phase='${{ steps.market.outputs.phase }}'
          if [[ "$mode" == "live" ]]; then
            echo 'ORACLE_V322_RUNTIME_VERIFY=PASS_LIVE_NO_RESTART' >> "$GITHUB_STEP_SUMMARY"
            echo 'LIVE 런타임은 검증기가 자동 재시작하지 않습니다. 재시작 시 BUY HALT가 자동 재설정되므로 운영자 의도 없는 상태변화를 방지합니다.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$phase" == "closed" ]]; then
            echo 'ORACLE_V322_RUNTIME_VERIFY=PASS_RESTARTED' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ORACLE_V322_RUNTIME_VERIFY=PASS_NO_RESTART' >> "$GITHUB_STEP_SUMMARY"
            echo '시장 세션이 closed가 아니므로 안전규칙에 따라 systemd 재시작 검증은 생략했습니다.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment ChatOps result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PHASE: ${{ steps.market.outputs.phase }}
          RUNTIME_MODE: ${{ steps.runtime.outputs.mode }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            body="✅ V3.2.2 Oracle runtime 검증 성공. mode=\`${RUNTIME_MODE:-unknown}\`, phase=\`${PHASE:-not-applicable}\`.\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          else
            body="❌ V3.2.2 Oracle runtime 검증 실패.\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '%b' "$body")"
