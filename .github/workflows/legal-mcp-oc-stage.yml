name: Legal MCP OC Secure Stage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: legal-mcp-oc-secure-stage
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.actor == github.repository_owner &&
      (startsWith(github.event.issue.title, '[legal-mcp-oc-bootstrap]') ||
       startsWith(github.event.issue.title, '[legal-mcp-oc-inject]'))
    runs-on: ubuntu-latest
    environment: oracle-dry-run

    steps:
      - name: Prepare pinned SSH trust
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_SSH_KNOWN_HOSTS"
          test -n "$ORACLE_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_jdss
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle_jdss ~/.ssh/known_hosts

      - name: Generate one-time Oracle public key
        if: startsWith(github.event.issue.title, '[legal-mcp-oc-bootstrap]')
        env:
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -i /home/runner/.ssh/oracle_jdss
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=/home/runner/.ssh/known_hosts
          )
          ssh "${ssh_opts[@]}" "${SERVER_USER}@${SERVER_HOST}" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          install -d -m 750 /opt/jh_legal_mcp
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /opt/jh_legal_mcp/.oc_stage_key.pem >/dev/null 2>&1
          echo '-----BEGIN ONE-TIME PUBLIC KEY-----'
          openssl pkey -in /opt/jh_legal_mcp/.oc_stage_key.pem -pubout
          echo '-----END ONE-TIME PUBLIC KEY-----'
          REMOTE

      - name: Validate ciphertext envelope
        if: startsWith(github.event.issue.title, '[legal-mcp-oc-inject]')
        env:
          OC_CIPHERTEXT_B64: ${{ github.event.issue.body }}
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s' "$OC_CIPHERTEXT_B64" | tr -d '\r\n ' > /tmp/oc.cipher.b64
          test -s /tmp/oc.cipher.b64
          base64 -d /tmp/oc.cipher.b64 > /tmp/oc.cipher.bin
          test "$(wc -c < /tmp/oc.cipher.bin)" -eq 256
          rm -f /tmp/oc.cipher.bin

      - name: Inject decrypted OC on Oracle and redeploy
        if: startsWith(github.event.issue.title, '[legal-mcp-oc-inject]')
        env:
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -i /home/runner/.ssh/oracle_jdss
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=/home/runner/.ssh/known_hosts
          )
          scp "${ssh_opts[@]}" /tmp/oc.cipher.b64 \
            "${SERVER_USER}@${SERVER_HOST}:/tmp/oc.cipher.b64"
          ssh "${ssh_opts[@]}" "${SERVER_USER}@${SERVER_HOST}" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          key=/opt/jh_legal_mcp/.oc_stage_key.pem
          test -s "$key"
          umask 077
          base64 -d /tmp/oc.cipher.b64 > /tmp/oc.cipher.bin
          openssl pkeyutl -decrypt \
            -inkey "$key" \
            -in /tmp/oc.cipher.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/oc.plain
          oc="$(cat /tmp/oc.plain)"
          [[ "$oc" =~ ^[A-Za-z0-9._@+-]{1,128}$ ]]
          printf 'LAW_OC=%s\n' "$oc" > /tmp/jh-legal-mcp-secrets.env
          unset oc
          /usr/local/sbin/jh-legal-mcp-deploy /tmp/jh-legal-mcp-secrets.env

          set -a
          . /opt/jh_legal_mcp/.env
          set +a
          test -n "${LAW_OC:-}"
          response="$(mktemp)"
          curl -fsS --max-time 20 --get 'https://www.law.go.kr/DRF/lawSearch.do' \
            --data-urlencode "OC=${LAW_OC}" \
            --data-urlencode 'target=law' \
            --data-urlencode 'type=JSON' \
            --data-urlencode 'query=근로기준법' \
            --data-urlencode 'display=1' > "$response"
          grep -q '근로기준법' "$response"
          rm -f "$response"
          echo 'LAW_OC live API verification passed'

          rm -f /tmp/oc.cipher.b64 /tmp/oc.cipher.bin /tmp/oc.plain "$key"
          REMOTE

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          MODE: ${{ startsWith(github.event.issue.title, '[legal-mcp-oc-bootstrap]') && 'bootstrap' || 'inject' }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            gh issue comment "$ISSUE_NUMBER" --body "Secure Legal MCP OC ${MODE} step completed successfully. No plaintext OC value was written to repository content or this issue."
          else
            gh issue comment "$ISSUE_NUMBER" --body "Secure Legal MCP OC ${MODE} step failed. Review the Actions run; plaintext OC is not logged by this workflow."
          fi
