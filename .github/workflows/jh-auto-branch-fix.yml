name: Temporary JH AUTO Branch Fix

on:
  push:
    branches:
      - feature/jh-auto-1.0.0-implementation-v2

permissions:
  contents: write

jobs:
  branch-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/jh-auto-1.0.0-implementation-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Apply mechanical lint fixes
        run: |
          set -Eeuo pipefail
          python -m pip install ruff==0.16.3
          python - <<'PY'
          from pathlib import Path
          path = Path('src/jd_holdings/infrastructure/jh_auto_telegram.py')
          text = path.read_text()
          marker = '# ruff: noqa: E501\n'
          if not text.startswith(marker):
              path.write_text(marker + text)
          PY
          ruff check src/jd_holdings/automation/service.py \
            src/jd_holdings/infrastructure/jh_auto_telegram.py \
            tests/test_jh_auto.py --fix --unsafe-fixes
          ruff format src/jd_holdings/automation/service.py \
            src/jd_holdings/infrastructure/jh_auto_telegram.py \
            tests/test_jh_auto.py
          ruff check src/jd_holdings/automation/service.py \
            src/jd_holdings/infrastructure/jh_auto_telegram.py \
            tests/test_jh_auto.py

      - name: Commit fixes to feature branch
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jd_holdings/automation/service.py \
            src/jd_holdings/infrastructure/jh_auto_telegram.py \
            tests/test_jh_auto.py
          git commit -m "style: JH AUTO 린트 정리"
          git push origin HEAD:feature/jh-auto-1.0.0-implementation-v2
