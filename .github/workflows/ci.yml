name: CI - Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect documentation-only pull request
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed-files
          if grep -Ev '\.md$' /tmp/changed-files | grep -q .; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        if: steps.scope.outputs.run_full == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements.lock -e '.[dev]'

      - name: Lint - Ruff
        if: steps.scope.outputs.run_full == 'true'
        run: ruff check .

      - name: Unit tests - Pytest
        if: steps.scope.outputs.run_full == 'true'
        # Current suite is ~70.4%; this is a ratchet floor, not a target.
        # Raise it as coverage improves and do not lower it without explicit review.
        run: pytest --cov=jd_holdings --cov-report=term-missing --cov-fail-under=70

      - name: Config validation - JDSS
        if: steps.scope.outputs.run_full == 'true'
        run: jdss validate-config

      - name: Record documentation-only fast path
        if: steps.scope.outputs.run_full != 'true'
        run: echo 'QUALITY_GATE=PASS_DOCS_ONLY' >> "$GITHUB_STEP_SUMMARY"
