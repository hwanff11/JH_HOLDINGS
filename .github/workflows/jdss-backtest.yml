name: JDSS V3 Backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "백테스트 종목"
        required: true
        default: "ALL"
        type: choice
        options: [ALL, TQQQ, SOXL]
      start:
        description: "시작일 (YYYY-MM-DD)"
        required: false
        default: "2011-01-01"
        type: string
      end:
        description: "종료일 (비워두면 최신 완결 거래일)"
        required: false
        default: ""
        type: string
      slippage:
        description: "슬리피지 (예: 0.0010)"
        required: false
        default: "0.0010"
        type: string
      issue_number:
        description: "결과를 남길 Issue 번호 (선택)"
        required: false
        default: ""
        type: string
  pull_request:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: backtest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    name: Backtest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issues' && github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[backtest-v3]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect backtest-sensitive changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_backtest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed-files
          if grep -Eq '^(strategy\.yaml|pyproject\.toml|src/|configs/|scripts/|tests/test_(backtest|v322_allocation)|\.github/workflows/jdss-backtest\.yml)' /tmp/changed-files; then
            echo "run_backtest=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_backtest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.scope.outputs.run_backtest == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        if: steps.scope.outputs.run_backtest == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run backtest
        if: steps.scope.outputs.run_backtest == 'true'
        env:
          INPUT_SYMBOL: ${{ inputs.symbol || 'ALL' }}
          INPUT_START: ${{ inputs.start || '2011-01-01' }}
          INPUT_END: ${{ inputs.end }}
          INPUT_SLIPPAGE: ${{ inputs.slippage || '0.0010' }}
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          args=(backtest --symbol "$INPUT_SYMBOL" --start "$INPUT_START" --slippage "$INPUT_SLIPPAGE" --output reports/backtest.json)
          if [[ -n "$INPUT_END" ]]; then args+=(--end "$INPUT_END"); fi
          jdss "${args[@]}"
      - name: Validate canonical V3.2.2 portfolio
        if: ${{ steps.scope.outputs.run_backtest == 'true' && (inputs.symbol || 'ALL') == 'ALL' && (inputs.start || '2011-01-01') == '2011-01-01' && inputs.end == '' && (inputs.slippage || '0.0010') == '0.0010' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/backtest.json").read_text(encoding="utf-8"))
          assert report["strategy_version"] == "JDSS-3.2.2-RS6M-ONEWAY-HWM75"
          assert report["config_version"] == "3.2.2"
          metrics = report["v322_portfolio"]["metrics"]
          # Yahoo adjusted-history refreshes can move the rolling canonical CAGR
          # slightly without changing strategy/configuration. Keep this guard
          # narrow enough to catch material regressions while tolerating that drift.
          assert 21.7 <= metrics["cagr_pct"] <= 22.8, metrics
          assert -31.6 <= metrics["mdd_pct"] <= -30.3, metrics
          assert 0.94 <= metrics["sharpe"] <= 1.07, metrics
          assert metrics["initial_risk_budget"] == 50000.0
          assert metrics["hwm_reinvestment_fraction"] == 0.75
          assert metrics["profit_reinvestment"] == "HWM75_CONTROLLED"
          assert metrics["idle_cash_enabled"] is False
          assert metrics["initial_onboarding_enabled"] is True
          assert metrics["initial_onboarding_fractions_pct"] == [50.0, 75.0, 100.0]
          assert metrics["initial_onboarding_minimum_sessions"] == 3
          assert metrics["component_fills"]["allocation"] > 0
          assert 70 <= metrics["average_exposure_pct"] <= 90
          print("V3.2.2 canonical backtest contract OK", metrics)
          PY
      - name: Print and publish V3.2.2 summary
        if: steps.scope.outputs.run_backtest == 'true'
        env:
          INPUT_SYMBOL: ${{ inputs.symbol || 'ALL' }}
          INPUT_START: ${{ inputs.start || '2011-01-01' }}
          INPUT_END: ${{ inputs.end }}
          INPUT_SLIPPAGE: ${{ inputs.slippage || '0.0010' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("reports/backtest.json").read_text(encoding="utf-8"))
          lines = ["# JDSS V3.2.2 백테스트 결과", "", f"- 종목: {os.environ['INPUT_SYMBOL']}",
                   f"- 기간: {os.environ['INPUT_START']} ~ {os.environ['INPUT_END'] or '최신 완결 거래일'}",
                   f"- 슬리피지: {os.environ['INPUT_SLIPPAGE']}", f"- 전략 버전: {report['strategy_version']}", "",
                   "| 구분 | Total Return | CAGR | MDD | 완료 사이클 |", "|---|---:|---:|---:|---:|"]
          for symbol, result in report["results"].items():
              m = result["metrics"]
              lines.append(f"| {symbol} virtual JDSS | {m['total_return_pct']:+.2f}% | {m['cagr_pct']:+.2f}% | {m['mdd_pct']:.2f}% | {m['closed_cycles']} |")
          portfolio = report.get("portfolio_metrics", {})
          if portfolio:
              lines += ["", "## V3.2.2 통합 포트폴리오", "", f"- Total Return: {portfolio['total_return_pct']:+.2f}%",
                        f"- CAGR: {portfolio['cagr_pct']:+.2f}%", f"- MDD: {portfolio['mdd_pct']:.2f}%"]
          v3 = report.get("v322_portfolio", {}).get("metrics", {})
          if v3:
              lines += [f"- Sharpe: {v3['sharpe']:.3f}", f"- Sortino: {v3['sortino']:.3f}",
                        f"- 평균 노출: {v3['average_exposure_pct']:.2f}%",
                        f"- Allocation 체결: {v3['component_fills']['allocation']}",
                        f"- 시작 위험예산: ${v3['initial_risk_budget']:,.2f}",
                        f"- HWM 재투자율: {v3['hwm_reinvestment_fraction'] * 100:.0f}%",
                        f"- 최대 sizing base: ${v3['maximum_sizing_base']:,.2f}",
                        f"- 최종 sizing base: ${v3['final_sizing_base']:,.2f}",
                        f"- 반도체 RS 활성일: {v3['semiconductor_active_days_pct']:.2f}%",
                        f"- SGOV: {'ON' if v3.get('idle_cash_enabled') else 'OFF'}"]
              annual = v3.get("annual_returns_pct", {})
              if annual:
                  lines += ["", "## 연도별 수익률", "", "| 연도 | 수익률 |", "|---|---:|"]
                  lines += [f"| {period} | {value:+.2f}% |" for period, value in annual.items()]
          summary = "\n".join(lines) + "\n"
          Path("reports/backtest.md").write_text(summary, encoding="utf-8")
          print("===== JDSS BACKTEST RESULT =====")
          print(summary)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write(summary)
          PY
      - name: Upload detailed report archive
        if: steps.scope.outputs.run_backtest == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jdss-backtest-${{ github.run_id }}
          path: reports/backtest.*
      - name: Comment result on Issue
        if: ${{ steps.scope.outputs.run_backtest == 'true' && (github.event_name == 'issues' || inputs.issue_number != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file reports/backtest.md
      - name: Record fast path
        if: steps.scope.outputs.run_backtest != 'true'
        run: echo 'BACKTEST=PASS_NOT_STRATEGY_SENSITIVE' >> "$GITHUB_STEP_SUMMARY"

  research_initial_entry:
    if: >-
      github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[research-initial-entry]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        if: steps.scope.outputs.run_backtest == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run initial-entry scenario sweep
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          python scripts/research_initial_entry_scenarios.py \
            --stride 1 \
            --output-json reports/initial-entry-research.json \
            --output-md reports/initial-entry-research.md
      - name: Publish summary
        run: cat reports/initial-entry-research.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload research report
        uses: actions/upload-artifact@v7
        with:
          name: initial-entry-research-${{ github.run_id }}
          path: reports/initial-entry-research.*
      - name: Comment result on Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file reports/initial-entry-research.md
