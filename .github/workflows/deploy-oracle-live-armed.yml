name: Deploy Oracle Live Armed

on:
  workflow_dispatch:
  issues:
    # `opened` is the normal ChatOps path. `reopened` lets an authorized
    # operator safely retry the same deployment request after a skipped or
    # transiently failed issue event without requiring workflow_dispatch.
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  # Every issue wakes all issue-based workflows before their job-level `if` is
  # evaluated. A dedicated group prevents skipped dry-run/commission workflows
  # from replacing this pending live update run.
  group: oracle-jdss-live-update
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[deploy-oracle-live-armed]')))
    runs-on: ubuntu-latest
    # Existing protected environment is retained until live-only credentials are
    # separately provisioned. Owner-only gating above prevents manual-dispatch widening.
    environment: oracle-dry-run
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact latest main
        id: ref
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git checkout -B main HEAD
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run live update safety gates
        run: |
          set -Eeuo pipefail
          pip install --constraint requirements.lock -e '.[dev]'
          python -m ruff check .
          python -m pytest \
            tests/test_jh_auto.py \
            tests/test_jh_auto_prelive_hardening.py \
            tests/test_jh_auto_final_ops_hardening.py \
            tests/test_live_entrypoints.py \
            tests/test_live_runtime_update_contract.py \
            tests/test_live_deployment_contract.py \
            tests/test_live_runtime_safety.py \
            tests/test_live_preflight_review_hardening.py \
            tests/test_operational_safety.py \
            tests/test_deployment_contract.py \
            tests/test_toss_client.py \
            tests/test_live_runtime_resilience.py \
            tests/test_oracle_health_token_isolation.py
          jdss validate-config
          grep -q 'live_enabled: false' strategy.yaml
          grep -q 'jdss-bot = "jd_holdings.runtime:main"' pyproject.toml

      - name: Prepare pinned SSH trust
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_SSH_KNOWN_HOSTS"
          test -n "$ORACLE_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_jdss
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle_jdss ~/.ssh/known_hosts

      - name: Arm BUY halt for live update
        env:
          SSH_KEY_PATH: /home/runner/.ssh/oracle_jdss
          SSH_KNOWN_HOSTS_PATH: /home/runner/.ssh/known_hosts
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SERVER_TARGET_DIR: /home/ubuntu/JH_HOLDINGS
          SYSTEMD_SERVICE: jh_holdings_bot
          REMOTE_PYTHON_BIN: ${{ vars.ORACLE_PYTHON || 'python3.12' }}
        run: |
          set -Eeuo pipefail
          bash ./prepare_live_update_halt.sh

      - name: Deploy latest main while preserving LIVE-ARMED
        env:
          SSH_KEY_PATH: /home/runner/.ssh/oracle_jdss
          SSH_KNOWN_HOSTS_PATH: /home/runner/.ssh/known_hosts
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SERVER_TARGET_DIR: /home/ubuntu/JH_HOLDINGS
          SYSTEMD_SERVICE: jh_holdings_bot
          REMOTE_PYTHON_BIN: ${{ vars.ORACLE_PYTHON || 'python3.12' }}
          SKIP_LOCAL_CHECKS: "1"
        run: |
          set -Eeuo pipefail
          LOCAL_PYTHON="$(command -v python)" bash ./deploy_live_armed.sh

      - name: Report ChatOps deployment result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEPLOY_REF: ${{ steps.ref.outputs.ref }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            message="✅ Oracle 실거래 안전 배포 성공: \`$DEPLOY_REF\`\n\n배포 전 신규 BUY를 자동 잠근 뒤 기존 실거래 원장·계좌 연결을 보존하고 계좌 대조·읽기 전용 점검·Telegram 8개 메뉴 확인을 통과했습니다.\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          else
            message="❌ Oracle 실거래 안전 배포 실패: \`${DEPLOY_REF:-버전 확인 실패}\`\n\n배포 시작 전에 신규 BUY를 먼저 차단하며, 실패 시 잠금 상태를 유지합니다. 주문·계좌정보는 Actions 로그에 출력하지 않습니다.\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '%b' "$message")"
