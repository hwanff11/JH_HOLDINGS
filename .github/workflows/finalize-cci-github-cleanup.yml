name: Finalize CCI GitHub Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-cci-github-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete retired CCI maintenance branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          for ref in \
            ops/cci-v4.0.1-payload \
            maintenance/finalize-cci-v401 \
            maintenance/finalize-cci-v401-branch-cleanup \
            maintenance/finalize-cci-v401-branch-cleanup2 \
            maintenance/finalize-cci-v401-final
          do
            if gh api "repos/$GH_REPO/git/ref/heads/$ref" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$ref"
              echo "deleted $ref"
            else
              echo "already absent $ref"
            fi
          done
