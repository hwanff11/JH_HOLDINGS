name: Deploy Oracle Legal MCP

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-legal-mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[deploy-legal-mcp]'))
    runs-on: ubuntu-latest
    environment: oracle-dry-run

    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1

      - name: Validate deployment script
        run: |
          set -Eeuo pipefail
          bash -n ops/legal-mcp/deploy.sh
          grep -q 'ba10add7c6359ca1587b420153b7cd66eba28d30' ops/legal-mcp/deploy.sh
          grep -q '127.0.0.1' ops/legal-mcp/deploy.sh

      - name: Prepare pinned SSH trust
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_SSH_KNOWN_HOSTS"
          test -n "$ORACLE_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_jdss
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle_jdss ~/.ssh/known_hosts

      - name: Prepare optional Legal MCP secret injection
        env:
          LEGAL_MCP_LAW_OC: ${{ secrets.LEGAL_MCP_LAW_OC }}
        run: |
          set -Eeuo pipefail
          umask 077
          printf 'LAW_OC=%s\n' "$LEGAL_MCP_LAW_OC" > /tmp/jh-legal-mcp-secrets.env

      - name: Deploy pinned Korean Law MCP
        env:
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -i /home/runner/.ssh/oracle_jdss
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=/home/runner/.ssh/known_hosts
          )

          scp "${ssh_opts[@]}" ops/legal-mcp/deploy.sh \
            "${SERVER_USER}@${SERVER_HOST}:/tmp/jh-legal-mcp-deploy.sh"
          scp "${ssh_opts[@]}" /tmp/jh-legal-mcp-secrets.env \
            "${SERVER_USER}@${SERVER_HOST}:/tmp/jh-legal-mcp-secrets.env"

          ssh "${ssh_opts[@]}" "${SERVER_USER}@${SERVER_HOST}" \
            'sudo install -m 700 /tmp/jh-legal-mcp-deploy.sh /usr/local/sbin/jh-legal-mcp-deploy && sudo /usr/local/sbin/jh-legal-mcp-deploy /tmp/jh-legal-mcp-secrets.env'

      - name: Verify isolation and health
        env:
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -i /home/runner/.ssh/oracle_jdss
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=/home/runner/.ssh/known_hosts
          )

          ssh "${ssh_opts[@]}" "${SERVER_USER}@${SERVER_HOST}" '
            set -Eeuo pipefail
            curl -fsS --max-time 5 http://127.0.0.1:3100/health >/dev/null
            sudo docker inspect -f "{{.State.Status}} {{.HostConfig.RestartPolicy.Name}} {{json .HostConfig.PortBindings}}" jh-legal-mcp
            sudo docker ps --filter name=^/jh-legal-mcp$ --format "{{.Names}} {{.Status}} {{.Ports}}"
            if sudo docker ps --filter name=^/jh-legal-mcp$ --format "{{.Ports}}" | grep -q "0.0.0.0:3100"; then
              echo "Legal MCP unexpectedly exposed on all interfaces" >&2
              exit 1
            fi
          '

      - name: Report deployment result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            message="✅ Legal MCP Oracle 배포 성공\n\n- upstream: korean-law-mcp v4.12.3 pinned commit\n- runtime: Docker / 512MiB / 1 CPU\n- bind: 127.0.0.1:3100 only\n- JDSS와 별도 /opt/jh_legal_mcp 및 별도 컨테이너\n\n법제처 키는 \`LEGAL_MCP_LAW_OC\` secret이 있을 때만 갱신되며 값은 로그에 출력하지 않습니다.\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          else
            message="❌ Legal MCP Oracle 배포 실패\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '%b' "$message")"
