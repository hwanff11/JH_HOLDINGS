name: Deploy CCI Oracle

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: oracle-cci-live-update
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[deploy-cci-oracle]')))
    runs-on: ubuntu-latest
    environment: oracle-dry-run
    steps:
      - name: Checkout encrypted CCI payload only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/cci-v4.0.1-encrypted-payload
          path: payload_repo
          persist-credentials: false
          fetch-depth: 1

      - name: Validate encrypted payload manifest
        env:
          EXPECTED_SHA: 2302e8e91d95c945d30dacf48672959858a4fa1a
        run: |
          set -Eeuo pipefail
          PAYLOAD_DIR="$GITHUB_WORKSPACE/payload_repo/.cci_payload"
          test -d "$PAYLOAD_DIR"
          test "$(tr -d '\r\n' < "$PAYLOAD_DIR/commit.sha")" = "$EXPECTED_SHA"
          test -s "$PAYLOAD_DIR/key.b64"
          test -s "$PAYLOAD_DIR/payload.enc.sha256"
          test -s "$PAYLOAD_DIR/payload.plain.sha256"
          compgen -G "$PAYLOAD_DIR/payload.part.*" >/dev/null
          cat "$PAYLOAD_DIR"/payload.part.* | base64 -d > "$RUNNER_TEMP/cci_payload.enc"
          test "$(sha256sum "$RUNNER_TEMP/cci_payload.enc" | awk '{print $1}')" = "$(tr -d '\r\n' < "$PAYLOAD_DIR/payload.enc.sha256")"
          rm -f "$RUNNER_TEMP/cci_payload.enc"

      - name: Prepare pinned Oracle SSH trust
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_SSH_KNOWN_HOSTS"
          test -n "$ORACLE_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_cci
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle_cci ~/.ssh/known_hosts

      - name: Transfer encrypted payload to Oracle
        env:
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          REMOTE_PAYLOAD_DIR: /home/ubuntu/.cci_payload_transfer_v401
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_cci \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SERVER_USER@$SERVER_HOST" \
            "rm -rf '$REMOTE_PAYLOAD_DIR' && install -d -m 700 '$REMOTE_PAYLOAD_DIR'"
          scp -i ~/.ssh/oracle_cci \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            "$GITHUB_WORKSPACE"/payload_repo/.cci_payload/* \
            "$SERVER_USER@$SERVER_HOST:$REMOTE_PAYLOAD_DIR/"

      - name: Decrypt, deploy and verify exact CCI v4.0.1
        env:
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          EXPECTED_SHA: 2302e8e91d95c945d30dacf48672959858a4fa1a
          TARGET_DIR: /home/ubuntu/cci_nvdl
          SERVICE_NAME: cci_bot
          REMOTE_PAYLOAD_DIR: /home/ubuntu/.cci_payload_transfer_v401
          PRIVATE_KEY: /home/ubuntu/.cci_payload_key_v401.pem
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_cci \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SERVER_USER@$SERVER_HOST" \
            bash -s -- "$TARGET_DIR" "$SERVICE_NAME" "$EXPECTED_SHA" "$REMOTE_PAYLOAD_DIR" "$PRIVATE_KEY" <<'REMOTE'
          set -Eeuo pipefail
          TARGET_DIR="$1"
          SERVICE_NAME="$2"
          EXPECTED_SHA="$3"
          PAYLOAD_DIR="$4"
          PRIVATE_KEY="$5"
          PARENT_DIR="$(dirname "$TARGET_DIR")"
          BASE_NAME="$(basename "$TARGET_DIR")"
          STAMP="$(date +%Y%m%d_%H%M%S)"
          WORK_DIR="$PARENT_DIR/.cci_payload_work.$STAMP"
          STAGE_DIR="$PARENT_DIR/.${BASE_NAME}.stage.$STAMP"
          OLD_DIR="$PARENT_DIR/.${BASE_NAME}.predeploy.$STAMP"
          FAILED_DIR="$PARENT_DIR/.${BASE_NAME}.failed.$STAMP"
          BACKUP_DIR="$PARENT_DIR/.cci_deploy_backups/$STAMP"
          SWAPPED=0
          STOPPED=0

          cleanup_transfer() {
            rm -rf "$WORK_DIR" "$PAYLOAD_DIR" 2>/dev/null || true
          }

          rollback() {
            rc=$?
            echo "Deployment failed (rc=$rc). Restoring previous runtime directory." >&2
            if [[ "$SWAPPED" = 1 ]]; then
              sudo systemctl stop "$SERVICE_NAME" || true
              [[ ! -e "$TARGET_DIR" ]] || mv "$TARGET_DIR" "$FAILED_DIR" || true
              [[ ! -e "$OLD_DIR" ]] || mv "$OLD_DIR" "$TARGET_DIR" || true
              sudo systemctl daemon-reload || true
              sudo systemctl restart "$SERVICE_NAME" || true
              sudo systemctl --no-pager --full status "$SERVICE_NAME" | head -25 || true
            elif [[ "$STOPPED" = 1 ]]; then
              sudo systemctl restart "$SERVICE_NAME" || true
            fi
            [[ ! -e "$STAGE_DIR" ]] || rm -rf "$STAGE_DIR" || true
            cleanup_transfer
            exit "$rc"
          }
          trap rollback ERR

          test -d "$TARGET_DIR" || { echo 'CCI target directory missing'; exit 20; }
          test -f "$TARGET_DIR/.env" || { echo 'CCI runtime .env missing'; exit 21; }
          test -s "$PRIVATE_KEY" || { echo 'CCI one-time private key missing'; exit 22; }
          test -d "$PAYLOAD_DIR" || { echo 'Encrypted payload directory missing'; exit 23; }
          test "$(tr -d '\r\n' < "$PAYLOAD_DIR/commit.sha")" = "$EXPECTED_SHA"

          install -d -m 700 "$WORK_DIR" "$STAGE_DIR" "$BACKUP_DIR"
          cat "$PAYLOAD_DIR"/payload.part.* | base64 -d > "$WORK_DIR/payload.enc"
          EXPECTED_ENC_HASH="$(tr -d '\r\n' < "$PAYLOAD_DIR/payload.enc.sha256")"
          test "$(sha256sum "$WORK_DIR/payload.enc" | awk '{print $1}')" = "$EXPECTED_ENC_HASH"
          base64 -d "$PAYLOAD_DIR/key.b64" > "$WORK_DIR/key.enc"
          openssl pkeyutl -decrypt -inkey "$PRIVATE_KEY" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$WORK_DIR/key.enc" -out "$WORK_DIR/aes.pass"
          chmod 600 "$WORK_DIR/aes.pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$WORK_DIR/payload.enc" -out "$WORK_DIR/payload.tar.gz" \
            -pass file:"$WORK_DIR/aes.pass"
          EXPECTED_PLAIN_HASH="$(tr -d '\r\n' < "$PAYLOAD_DIR/payload.plain.sha256")"
          test "$(sha256sum "$WORK_DIR/payload.tar.gz" | awk '{print $1}')" = "$EXPECTED_PLAIN_HASH"
          tar -xzf "$WORK_DIR/payload.tar.gz" -C "$STAGE_DIR"

          test "$(tr -d '\r\n' < "$STAGE_DIR/CCI_DEPLOY_SHA")" = "$EXPECTED_SHA"
          test ! -e "$STAGE_DIR/.env"
          for f in bot_main.py bot_app.py runtime_hardening.py strategy_engine.py indicator.py toss_client.py state_manager.py requirements.txt; do
            test -f "$STAGE_DIR/$f" || { echo "Required deployment file missing: $f"; false; }
          done

          UV_BIN="$HOME/.local/bin/uv"
          if [[ ! -x "$UV_BIN" ]]; then
            python3 -m pip install --user --disable-pip-version-check --no-warn-script-location "uv==0.12.10"
          fi
          export UV_PYTHON_INSTALL_DIR="$HOME/.local/share/uv/python"
          "$UV_BIN" python install 3.12
          "$UV_BIN" venv --python 3.12 "$STAGE_DIR/venv"
          "$UV_BIN" pip install --python "$STAGE_DIR/venv/bin/python" -r "$STAGE_DIR/requirements.txt"
          "$STAGE_DIR/venv/bin/python" -m py_compile \
            "$STAGE_DIR/bot_main.py" "$STAGE_DIR/bot_app.py" \
            "$STAGE_DIR/runtime_hardening.py" "$STAGE_DIR/strategy_engine.py" \
            "$STAGE_DIR/indicator.py" "$STAGE_DIR/toss_client.py" "$STAGE_DIR/state_manager.py"

          cp "$TARGET_DIR/.env" "$BACKUP_DIR/.env"
          sudo systemctl stop "$SERVICE_NAME"
          STOPPED=1
          for f in state.db state.db-wal state.db-shm bot.log; do
            if [[ -f "$TARGET_DIR/$f" ]]; then
              cp "$TARGET_DIR/$f" "$BACKUP_DIR/$f"
              cp "$TARGET_DIR/$f" "$STAGE_DIR/$f"
            fi
          done
          cp "$TARGET_DIR/.env" "$STAGE_DIR/.env"
          chmod 600 "$STAGE_DIR/.env"

          mv "$TARGET_DIR" "$OLD_DIR"
          mv "$STAGE_DIR" "$TARGET_DIR"
          SWAPPED=1
          STOPPED=0

          cat > "/tmp/${SERVICE_NAME}.service" <<EOF
          [Unit]
          Description=JH Holdings CCI Trading Bot
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=$(id -un)
          WorkingDirectory=${TARGET_DIR}
          EnvironmentFile=${TARGET_DIR}/.env
          ExecStart=${TARGET_DIR}/venv/bin/python3 -u ${TARGET_DIR}/bot_main.py
          Restart=always
          RestartSec=5
          TimeoutStopSec=20

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo mv "/tmp/${SERVICE_NAME}.service" "/etc/systemd/system/${SERVICE_NAME}.service"
          sudo systemctl daemon-reload
          sudo systemctl enable "$SERVICE_NAME" >/dev/null
          sudo systemctl restart "$SERVICE_NAME"
          sleep 6
          sudo systemctl is-active --quiet "$SERVICE_NAME"
          sleep 6
          sudo systemctl is-active --quiet "$SERVICE_NAME"

          MAIN_PID="$(sudo systemctl show -p MainPID --value "$SERVICE_NAME")"
          test "$MAIN_PID" != 0
          RUNNING_MAIN="$(tr '\0' ' ' < "/proc/$MAIN_PID/cmdline")"
          case "$RUNNING_MAIN" in
            *"$TARGET_DIR/bot_main.py"*) ;;
            *) echo "unexpected process command: $RUNNING_MAIN"; false ;;
          esac
          test "$(tr -d '\r\n' < "$TARGET_DIR/CCI_DEPLOY_SHA")" = "$EXPECTED_SHA"

          cd "$TARGET_DIR"
          set -a
          . ./.env
          set +a
          venv/bin/python - <<'PY'
          import os
          import time
          import requests
          from toss_client import TossClient

          c = TossClient()
          c.authenticate()
          balances = {symbol: c.get_account_balances(symbol) for symbol in ("NVDL", "USD")}
          open_orders = c.get_orders(status="OPEN", limit=100)
          print(f"BROKER_READ_OK symbols={','.join(balances)} open_orders={len(open_orders)}")

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          base = f"https://api.telegram.org/bot{token}"

          def telegram_get(method: str):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      response = requests.get(f"{base}/{method}", timeout=(5, 30))
                      response.raise_for_status()
                      return response
                  except requests.RequestException as exc:
                      last_error = exc
                      if attempt == 3:
                          break
                      time.sleep(2 ** attempt)
              raise last_error

          me = telegram_get("getMe")
          commands = telegram_get("getMyCommands")
          names = {x.get("command") for x in commands.json().get("result", [])}
          required = {"ping", "status", "order"}
          missing = required - names
          if missing:
              raise SystemExit(f"missing Telegram commands: {sorted(missing)}")
          print("TELEGRAM_COMMANDS_OK commands=ping,status,order")
          PY

          RECENT="$(sudo journalctl -u "$SERVICE_NAME" --since '-3 minutes' --no-pager || true)"
          if printf '%s\n' "$RECENT" | grep -E 'Traceback \(most recent call last\)|CRITICAL|Unhandled exception' >/dev/null; then
            echo 'Recent fatal-looking exception detected in cci_bot log' >&2
            printf '%s\n' "$RECENT" | tail -80 >&2
            false
          fi

          venv/bin/python - <<'PY'
          import os
          import time
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          payload = {
              "chat_id": chat_id,
              "text": "✅ CCI v4.0.1 운영배포 완료\n- exact source SHA 검증\n- systemd active 이중 확인\n- Toss NVDL/USD 및 OPEN 주문 read-only 조회 정상\n- /ping /status /order 명령 등록 확인\n- 최근 fatal 예외 없음",
          }
          last_error = None
          for attempt in range(1, 4):
              try:
                  r = requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      json=payload,
                      timeout=(5, 30),
                  )
                  r.raise_for_status()
                  print("TELEGRAM_NOTIFY_OK")
                  break
              except requests.RequestException as exc:
                  last_error = exc
                  if attempt == 3:
                      raise
                  time.sleep(2 ** attempt)
          PY

          mv "$OLD_DIR" "$BACKUP_DIR/source_predeploy"
          SWAPPED=0
          rm -f "$PRIVATE_KEY"
          cleanup_transfer
          trap - ERR
          echo "CCI_DEPLOY_OK commit=$EXPECTED_SHA backup=$BACKUP_DIR one_time_key_removed=true"
          REMOTE

      - name: Remove temporary public encrypted payload branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/ops/cci-v4.0.1-encrypted-payload"

      - name: Report deployment result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            body="✅ CCI v4.0.1 Oracle 운영배포 성공\n\n정확한 CCI source 커밋 \`2302e8e91d95c945d30dacf48672959858a4fa1a\` 검증, Oracle 복호화, systemd 이중 active, Toss read-only 잔고/OPEN 주문, Telegram /ping /status /order 등록, 최근 fatal 예외 점검을 모두 통과했습니다. 1회성 Oracle private key와 JH 임시 encrypted payload branch도 폐기했습니다.\n\nActions: $RUN_URL"
          else
            body="❌ CCI Oracle 운영배포 실패\n\n원자적 배포 트랜잭션이 실패한 경우 기존 운영 디렉터리를 자동 복원하고, 재시도를 위해 1회성 private key는 유지합니다. Actions: $RUN_URL"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '%b' "$body")"
