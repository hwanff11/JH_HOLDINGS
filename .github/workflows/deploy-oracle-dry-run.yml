name: Deploy Oracle Dry Run

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-jdss-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[deploy-oracle-dry-run]'))
    runs-on: ubuntu-latest
    environment: oracle-dry-run
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact latest main
        id: ref
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git checkout -B main HEAD
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Deploying exact latest main: $(git rev-parse HEAD)"

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run focused deployment gate
        run: |
          set -Eeuo pipefail
          pip install --constraint requirements.lock -e '.[dev]'
          python -m ruff check .
          deployment_tests=(
            tests/test_deployment_contract.py
            tests/test_v322_dry_run.py
            tests/test_managed_account_safety.py
            tests/test_operational_faults.py
            tests/test_operational_safety.py
            tests/test_live_commissioning.py
          )
          python -m pytest "${deployment_tests[@]}"
          jdss validate-config
          grep -q 'JDSS-3.2.2-RS6M-ONEWAY-HWM75' strategy.yaml
          grep -q 'config_version: "3.2.2"' strategy.yaml
          grep -q 'total_capital: 50000' strategy.yaml
          grep -q 'hwm_reinvestment_fraction: 0.75' strategy.yaml
          grep -q 'rs_lookback: 126' strategy.yaml
          grep -q 'rs_sleeve_fraction: 0.50' strategy.yaml
          grep -q 'jdss_overlay_weight: 0.05' strategy.yaml
          grep -q 'daily_analysis_time_kst: "07:00"' strategy.yaml
          grep -A3 '^idle_cash:' strategy.yaml | grep -q 'enabled: false'
          grep -q 'live_enabled: false' strategy.yaml

      - name: Prepare pinned SSH trust
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_SSH_KNOWN_HOSTS"
          test -n "$ORACLE_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_jdss
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle_jdss ~/.ssh/known_hosts
          # The strict scp/ssh connection below is the authoritative parser
          # and pinned hostname/key matcher for this exact known_hosts file.

      - name: Deploy and smoke-test JDSS V3.2.2 in forced dry-run mode
        env:
          SSH_KEY_PATH: /home/runner/.ssh/oracle_jdss
          SSH_KNOWN_HOSTS_PATH: /home/runner/.ssh/known_hosts
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SERVER_TARGET_DIR: /home/ubuntu/JH_HOLDINGS
          SYSTEMD_SERVICE: jh_holdings_bot
          REMOTE_PYTHON_BIN: ${{ vars.ORACLE_PYTHON || 'python3.12' }}
          LOCAL_PYTHON: /opt/hostedtoolcache/Python/3.12.*/x64/bin/python
          SKIP_LOCAL_CHECKS: "1"
        run: |
          set -Eeuo pipefail
          LOCAL_PYTHON="$(command -v python)" ./deploy.sh

      - name: Report ChatOps deployment result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEPLOY_REF: ${{ steps.ref.outputs.ref }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            message="✅ Oracle forced dry-run 배포 성공: \`$DEPLOY_REF\`\n\nrelease별 venv·DB snapshot·자동 rollback·SSH host key 고정·live 잠금·Toss read-only smoke를 통과했습니다.\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          else
            message="❌ Oracle dry-run 배포 실패: \`${DEPLOY_REF:-ref 확인 실패}\`\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '%b' "$message")"
